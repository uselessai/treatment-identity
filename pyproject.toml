[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "treatment-identity"
dynamic = ["version"]
description = "Verify declared treatments at the data-loader/training-step-input boundary."
readme = "README.md"
requires-python = ">=3.8"
license = {file = "LICENSE"}
dependencies = [
    "numpy>=1.20",
    "opencv-python>=4.5",
    "jsonschema>=4.10",
]

[project.scripts]
treatment-identity-selftest = "selftest:main"

[tool.setuptools]
# The self-test is a top-level module and must ship, or an installed
# `treatment-identity-selftest` fails with ModuleNotFoundError even though the
# wheel builds cleanly. The studies of the article live in studies/ and are run
# from a clone; they are not part of the installed package. Verified by
# tests/test_wheel_install.sh, which installs the built wheel under an
# isolated temporary prefix and runs the CLI from outside this tree.
packages = ["treatment_identity"]
py-modules = ["selftest"]

[tool.setuptools.dynamic]
version = {attr = "treatment_identity._version.__version__"}

[tool.setuptools.package-data]
treatment_identity = ["schemas/*.json"]
